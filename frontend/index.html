<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>Login</title>
</head>
<body>
    <div class="login-container">
        <div class="login-brand"> 
            <img class="school-logo" src="assets/zhandark-emblem.png" style="width: 300px;" alt="logo">
            <h1 class="school-name">EduTrack</h1>
            <p class="title">School Management System </p>
            <p class="desc">Manage your school smarter & easier. </p>

            <div class="brand-preview">

                <div class="preview-header">
                    <span class="perview-header">School Overview</span>
                    <span class="preview-status">◉ Live</span>
                </div>

                <div class="preview-stats">

                    <div class="preview-card">
                        <span class="preview-icon">👨‍🎓</span>
                        <div>
                            <strong>843</strong>
                            <small>Students</small>
                        </div>
                    </div>

                    <div class="preview-card">
                        <span class="preview-icon">✓</span>
                        <div>
                            <strong>94%</strong>
                            <small>Attendence</small>
                        </div>
                    </div>
                </div>
                 <div class="preview-bottom">
                        <div>
                            <small> Today's attendance</small>
                            <div class="progress">
                                <span></span>
                            </div>
                            <strong>94%</strong>
                        </div>
                    </div>  
            </div>
        </div>
        <div class="login-form">
            <heading class="head">Wellcome Back 👋</heading>
            <p class="sub-title">Sign in to manage your school</p>
            <label for="username">Username</label>
            <input type="text" name="username" id="username" >
            <label for="password">Password</label>
            <input type="text" name="password" id="password">

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox">
                    <span>Remember me</span>
                </label>
                <a href="#" class="forgot-password">Forget password?</a>
            </div>
            <button class="signin-btn" type="submit">Sign in → </button>

            <a href="#" class="account">Don't have an account !</a>
            
            <p class="login-footer">© 2026 Edu Track. All rights reserved</p>
        </div>

    </div>
</body>
</html>
